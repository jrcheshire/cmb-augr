name: tests

on:
  # No `push` trigger on main: PRs run the suite at merge time, so the
  # post-merge push to main would just re-run an identical green job.
  # Use the weekly schedule below (and workflow_dispatch) to catch any
  # regressions that slip in through a direct push.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Include @pytest.mark.slow tests (full-sky Wigner 3j + 200k MC)?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # Weekly full-suite run, Sunday 04:00 UTC
    - cron: "0 4 * * 0"

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Fast suite only (slow Wigner/MC + PySM-foreground compsep tests are marked
    # `slow` and run in the weekly job). Per-test hangs are bounded by pytest-timeout
    # (--timeout / --timeout-method=thread / --max-worker-restart=0 in the `test`
    # task), so this job cap is just a backstop, not the hang guard.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.72.0
          cache: true

      - name: Lint with ruff
        run: pixi run lint

      - name: Run pytest (fast subset)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_slow != 'true')
        env:
          AUGR_DELENS_WORKERS: "1"
          AUGR_SHT_NTHREADS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          echo "--- cpus/mem/disk before ---"
          nproc; free -m; df -h /
          # TEMPORARY DIAGNOSTIC: -v so the log names the test we die on. The dots-only
          # output of `pixi run test` cannot say which test stalls after 71%.
          # Mirrors the `test` task exactly apart from -v and the pinned -n 2.
          pixi run pytest tests/ -m 'not slow' -n 2 -v \
            --timeout=180 --timeout-method=thread --max-worker-restart=0 -ra
          echo "--- mem/disk after ---"
          free -m; df -h /

      - name: Run pytest (full suite, includes slow)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_slow == 'true')
        run: pixi run test-all
